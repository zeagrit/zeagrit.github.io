<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おこづかい帳</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おこづかい">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#d9f3ff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; background: #d9f3ff; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(#d9f3ff, #e6f6e1); font: 700 17px "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; color: #4a8f7e; }
  .wait img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 18px rgba(74,143,126,.25); animation: hop 1s ease-in-out infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
</style>
</head>
<body>
<div class="wait"><img src="icon-180.png" alt=""><div>ひらいています…</div></div>
<script>
  // アプリ本体（Googleのアプリ）を、注意書きなしでこのページの中に表示する
  var APP = 'https://script.google.com/macros/s/AKfycbyBVl-xJ_RH10nC7FrIpXgt32YrlPnLoVmcTMeff05O6P8xFuAMThv3fgodD9E7HcWJjw/exec';
  var f = document.createElement('iframe');
  f.src = APP + location.search;
  f.allow = 'camera; clipboard-write';
  f.style.opacity = '0';
  f.onload = function () { f.style.opacity = '1'; };
  document.body.appendChild(f);
</script>
</body>
</html>
